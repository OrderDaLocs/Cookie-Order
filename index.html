<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dalocs – One bite. Pure delight.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1253ad;
    --blue-deep: #0a1a8c;
    --sky: #86d4ff;
    --mist: #bccde6;
    --cream: #fffdf0;
    --ink: #1f4a5a;
    --error: #b3261e;
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    background: var(--blue);
    color: var(--cream);
    line-height: 1.5;
  }
  h1, h2, h3, .display { font-family: "Fredoka", "Nunito", sans-serif; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  .wrap { width: min(1080px, 92%); margin-inline: auto; }

  /* ---------- Header ---------- */
  header { padding: 28px 0 8px; }
  .head-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 16px;
  }
  .menu-panel {
    background: var(--mist);
    border-radius: 0 0 var(--radius) 0;
    padding: 18px 24px 6px;
    margin-left: calc((100vw - min(1080px, 92vw)) / -2);
    padding-left: calc((100vw - min(1080px, 92vw)) / 2 + 24px);
    border-top-left-radius: 0;
    align-self: stretch;
    display: flex; align-items: flex-end;
  }
  .menu-panel h1 {
    font-size: clamp(3.2rem, 9vw, 6.5rem);
    line-height: .85;
    letter-spacing: -.02em;
    color: #fff;
    font-weight: 700;
  }
  .menu-panel h1 span { color: var(--blue-deep); }
  .brand { text-align: center; }
  .brand .logo {
    display: inline-block;
    background: var(--cream);
    color: var(--blue-deep);
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 3rem);
    letter-spacing: .04em;
    padding: 18px 40px;
    border-radius: 60% 40% 55% 45% / 55% 50% 50% 45%;
  }
  .brand p { margin-top: 10px; font-size: .85rem; letter-spacing: .06em; }

  /* ---------- Promo + info ---------- */
  .promo {
    margin: 28px 0 8px;
    background: var(--mist);
    color: var(--blue-deep);
    border-radius: var(--radius);
    padding: 22px 28px;
    text-align: center;
  }
  .promo h2 { font-size: clamp(1.4rem, 3.4vw, 2rem); }
  .promo p { color: var(--blue); font-size: 1.1rem; }

  /* ---------- Menu sections ---------- */
  .category {
    display: inline-block;
    margin: 40px 0 22px;
    background: var(--sky);
    color: #fff;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    font-weight: 700;
    padding: 6px 48px 6px 26px;
    border-radius: 0 999px 999px 0;
    margin-left: calc((100vw - min(1080px, 92vw)) / -2);
    padding-left: calc((100vw - min(1080px, 92vw)) / 2 + 26px);
    text-shadow: 0 1px 0 rgba(10,26,140,.25);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 26px;
  }
  .cookie { position: relative; text-align: center; }
  .img-slot {
    position: relative;
    aspect-ratio: 1;
    border: 3px dashed var(--sky);
    border-radius: 50%;
    background: rgba(134, 212, 255, .12);
    display: grid; place-items: center;
    overflow: hidden;
  }
  .img-slot img { 
    position: absolute; 
    inset: 0; 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    z-index: 1;
  }
  .price {
    position: absolute; top: -6px; right: 4px;
    width: 76px; height: 76px;
    display: grid; place-items: center;
    background: var(--sky);
    color: #fff;
    font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.15rem;
    clip-path: polygon(50% 0, 62% 14%, 80% 10%, 82% 28%, 100% 38%, 88% 54%, 96% 72%, 78% 78%, 70% 96%, 52% 88%, 34% 100%, 28% 82%, 8% 78%, 14% 60%, 0 44%, 16% 32%, 18% 12%, 38% 14%);
    text-shadow: 0 1px 0 rgba(10,26,140,.3);
    z-index: 2;
  }
  .name-tag {
    background: #fff;
    color: var(--ink);
    border-radius: 18px;
    padding: 8px 12px 10px;
    margin: -22px auto 12px;
    width: 86%;
    position: relative; z-index: 2;
  }
  .name-tag h3 { font-size: 1.3rem; line-height: 1.15; }
  .name-tag span { display: block; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; }

  .qty {
    display: inline-flex; align-items: center;
    background: var(--cream); border-radius: 999px; overflow: hidden;
  }
  .qty button {
    width: 42px; height: 42px; border: 0; cursor: pointer;
    background: transparent; color: var(--blue-deep);
    font-family: "Fredoka", sans-serif; font-size: 1.5rem; font-weight: 700;
  }
  .qty button:hover { background: var(--sky); }
  .qty output {
    min-width: 40px; text-align: center;
    color: var(--blue-deep); font-weight: 700; font-size: 1.1rem;
  }

  /* ---------- Order form ---------- */
  .order {
    margin: 56px 0 40px;
    background: var(--cream);
    color: var(--ink);
    border-radius: 30px;
    padding: clamp(22px, 4vw, 44px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(22px, 4vw, 44px);
  }
  .order h2 { color: var(--blue-deep); font-size: 2rem; margin-bottom: 14px; grid-column: 1 / -1; }
  .field { margin-bottom: 16px; }
  label { display: block; font-weight: 700; margin-bottom: 4px; }
  input[type="text"], input[type="tel"], input[type="date"], input[type="time"], select, textarea {
    width: 100%;
    font: inherit; color: var(--ink);
    padding: 12px 14px;
    border: 2px solid var(--mist);
    border-radius: 14px;
    background: #fff;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--sky); }
  textarea { min-height: 80px; resize: vertical; }
  .radio-group { display: flex; gap: 12px; margin-top: 6px; }
  .radio-option {
    display: flex; align-items: center; gap: 8px;
    background: #fff; padding: 10px 14px; border-radius: 12px;
    border: 2px solid var(--mist); cursor: pointer; flex: 1; font-weight: 700; font-size: .95rem;
  }
  .radio-option input { accent-color: var(--blue); width: 18px; height: 18px; }
  .hint { font-size: .85rem; opacity: .88; margin-top: 4px; color: var(--blue-deep); }

  .summary { background: var(--mist); border-radius: 20px; padding: 22px; align-self: start; color: var(--blue-deep); }
  .summary h3 { font-size: 1.4rem; margin-bottom: 10px; }
  .summary ul { list-style: none; min-height: 28px; }
  .summary li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed rgba(10,26,140,.3); }
  .summary .empty { opacity: .75; border: 0; }
  .totals { margin-top: 14px; }
  .totals div { display: flex; justify-content: space-between; padding: 3px 0; }
  .totals .discount { color: #0b6b3a; font-weight: 700; }
  .totals .grand { font-family: "Fredoka", sans-serif; font-size: 1.5rem; border-top: 2px solid var(--blue-deep); margin-top: 8px; padding-top: 8px; }
  .note { margin-top: 12px; font-size: .88rem; line-height: 1.4; }
  .submit {
    margin-top: 18px; width: 100%;
    border: 0; cursor: pointer;
    background: var(--blue-deep); color: #fff;
    font-family: "Fredoka", sans-serif; font-size: 1.25rem; font-weight: 600;
    padding: 14px; border-radius: 999px;
  }
  .submit:hover { background: var(--blue); }
  #error { color: var(--error); font-weight: 700; margin-top: 10px; min-height: 1.4em; }

  /* ---------- Footer info ---------- */
  .info {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 24px; text-align: center; padding: 30px 0 50px;
  }
  .info h3 { font-size: .95rem; letter-spacing: .12em; text-transform: uppercase; color: var(--sky); margin-bottom: 4px; }
  .info p { font-size: 1.05rem; }
  .info small { display: block; opacity: .85; }

  @media (max-width: 760px) {
    .head-grid { grid-template-columns: 1fr; justify-items: center; }
    .menu-panel { margin: 0; padding: 14px 24px 4px; border-radius: var(--radius); width: 100%; justify-content: center; }
    .order { grid-template-columns: 1fr; }
    .category { margin-left: -4vw; padding-left: calc(4vw + 22px); }
  }
</style>
</head>
<body>

<header>
  <div class="wrap head-grid">
    <div class="menu-panel"><h1>ME<span>N</span>
